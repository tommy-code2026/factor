<body>

<div class="wrap">
  <h1>因數倍數跳跳看 <span class="icon-3d">🐸✨</span></h1>
  <p class="sub">從零開始學倍數、因數、公倍數、公因數｜含短除法與輾轉相除法</p>
  <nav class="map" id="map" aria-label="九個階段"></nav>
  <section class="panel" id="panel"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================= 共用 ================= */
const NS='http://www.w3.org/2000/svg';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
let CUR=null;
function sv(t,a,p,x){
  if(typeof p!=='object'){x=p;p=CUR}
  const e=document.createElementNS(NS,t);
  if(t==='svg')CUR=e;
  for(const k in a)e.setAttribute(k,a[k]);
  if(x!=null)e.textContent=x;
  p&&p.appendChild(e);
  return e
}
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a*b/gcd(a,b);
const fr=(t,b)=>`<span class="frac"><span>${t}</span><span>${b}</span></span>`;
const inp=(id,lab)=>`<input id="${id}" inputmode="numeric" aria-label="${lab}">`;
const mixed=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;return r?(w?`${w} 又 ${r}/${d}`:`${r}/${d}`):`${w}`};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function svgBox(h,label,w){
  const st=el('<div class="stage"></div>');
  const svg = sv('svg',{viewBox:`0 0 ${w||1000} ${h}`,role:'img','aria-label':label||'圖形'},st);
  svg.innerHTML = `
    <defs>
      <filter id="f3d" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
      </filter>
      <filter id="f3d-light" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
      </filter>
      <filter id="glow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffc048" flood-opacity="0.8"/>
      </filter>
    </defs>
  `;
  return st
}

function bar(x,y,w,h,d,filled,col,opts){
  opts=opts||{};const cuts=opts.cuts||[...Array(d+1)].map((_,i)=>i/d);
  sv('rect',{x,y,width:w,height:h,fill:css('--cloth'),stroke:css('--ink'),'stroke-width':3,rx:8, filter:'url(#f3d)'});
  const cells=[];
  for(let i=0;i<cuts.length-1;i++){
    const x1=x+cuts[i]*w,x2=x+cuts[i+1]*w;
    const on=Array.isArray(filled)?filled[i]:i<filled;
    const r=sv('rect',{x:x1+2,y:y+2,width:x2-x1-4,height:h-4,rx:4, fill:on?col:'transparent',style:opts.click?'cursor:pointer':''});
    cells.push(r);
    if(i>0)sv('line',{x1:x1,y1:y,x2:x1,y2:y+h,stroke:css('--ink'),'stroke-width':opts.sub&&i%opts.sub!==0?1.5:3,'stroke-dasharray':opts.sub&&i%opts.sub!==0?'6 4':''});
  }
  return cells
}

/* ================= 數學工具 - 短除法與輾轉相除法 ================= */
function getShortDivisionSteps(a, b) {
    let steps = [];
    let currA = a, currB = b;
    let p = 2;
    while (p <= Math.min(currA, currB)) {
        if (currA % p === 0 && currB % p === 0) {
            steps.push({ divisor: p, a: currA, b: currB });
            currA /= p;
            currB /= p;
        } else {
            p++;
        }
    }
    return { steps, finalA: currA, finalB: currB };
}

function showShortDiv(a, b, mode) {
    const { steps, finalA, finalB } = getShortDivisionSteps(a, b);
    let html = '<div style="background:#fff; padding:15px; border-radius:16px; margin-top:10px; border:2px solid var(--line); display:inline-block; text-align:left; box-shadow:0 8px 15px rgba(0,0,0,0.05);">';
    if (steps.length === 0) {
        html += `<div style="font-weight:bold; color:var(--ink);">💡 ${a} 和 ${b} 互質，沒有除 1 以外的公因數了。</div>`;
        if (mode === 'lcm') html += `<div style="color:var(--accent-shadow); margin-top:8px; font-weight:bold;">最小公倍數 = ${a} × ${b} = ${a*b}</div>`;
        else if (mode === 'gcd') html += `<div style="color:var(--accent-shadow); margin-top:8px; font-weight:bold;">最大公因數 = 1</div>`;
        html += '</div>';
        return html;
    }
    
    let gcdVal = 1;
    html += '<div style="font-family: monospace; font-size: 24px; font-weight: 900;">';
    for (let s of steps) {
        gcdVal *= s.divisor;
        html += `<div style="display:flex; align-items:center;">`;
        html += `<div style="color:var(--accent); width:35px; text-align:right; padding-right:10px;">${s.divisor}</div>`;
        html += `<div style="border-left:3px solid var(--ink); border-bottom:3px solid var(--ink); padding:4px 12px; letter-spacing:12px;">${s.a.toString().padStart(2,'\u00A0')}${s.b.toString().padStart(2,'\u00A0')}</div>`;
        html += `</div>`;
    }
    html += `<div style="display:flex; align-items:center;">`;
    html += `<div style="width:35px; padding-right:10px;"></div>`;
    html += `<div style="padding:4px 12px; margin-left:3px; letter-spacing:12px;">${finalA.toString().padStart(2,'\u00A0')}${finalB.toString().padStart(2,'\u00A0')}</div>`;
    html += `</div></div>`;
    
    let lcmVal = gcdVal * finalA * finalB;
    html += `<div style="margin-top:16px; font-weight:800; font-size:18px; line-height:1.6;">`;
    if (mode === 'gcd') {
        html += `💡 <span style="color:var(--accent-shadow);">最大公因數</span> = 左邊相乘<br> = ${steps.map(s=>s.divisor).join(' × ')} = <b>${gcdVal}</b>`;
    } else if (mode === 'lcm') {
        html += `💡 <span style="color:var(--accent-shadow);">最小公倍數</span> = 左邊乘下面<br> = ${steps.map(s=>s.divisor).join(' × ')} × ${finalA} × ${finalB} = <b>${lcmVal}</b>`;
    } else if (mode === 'frac') {
        html += `💡 <b>最大公因數</b> = ${gcdVal}。分子分母同除以 ${gcdVal}，一步約成最簡分數。`;
    } else {
        html += `💡 <span style="color:var(--accent-shadow);">最大公因數</span> = ${steps.map(s=>s.divisor).join(' × ')} = <b>${gcdVal}</b><br>`;
        html += `💡 <span style="color:var(--accent-shadow);">最小公倍數</span> = ${steps.map(s=>s.divisor).join(' × ')} × ${finalA} × ${finalB} = <b>${lcmVal}</b>`;
    }
    html += `</div></div>`;
    return html;
}

function showEuclidean(a, b) {
  let html = `<div style="background:#fff; padding:15px; border-radius:16px; margin-top:10px; font-size:20px; line-height:1.6; border:2px solid var(--line); box-shadow:0 8px 15px rgba(0,0,0,0.05); display:inline-block;">`;
  let currA = Math.max(a, b);
  let currB = Math.min(a, b);
  while(currB !== 0) {
    let q = Math.floor(currA / currB);
    let r = currA % currB;
    html += `<div><span style="color:var(--c1-shadow);font-weight:bold;">${currA}</span> = ${q} × <span style="color:var(--c2-shadow);font-weight:bold;">${currB}</span> + <b style="color:var(--bad)">${r}</b></div>`;
    currA = currB;
    currB = r;
  }
  html += `<div style="margin-top:12px; font-weight:bold; color:var(--accent-shadow); font-size:22px;">🎉 餘數為 0，最大公因數 = ${currA}</div></div>`;
  return html;
}

function euclideanSvgDOM(w, h) {
    let maxW = 700;
    let scale = maxW / Math.max(w, h);
    let st = svgBox(Math.min(w,h) * scale, '輾轉相除法長方形', maxW);
    let svg = st.firstChild;
    let currX = 0, currY = 0, currW = w, currH = h;
    const colors = [css('--c1s'), '#e8f5e9', '#fff3cd', '#f3e5f5', '#ffebee'];
    let cIdx = 0;
    
    while(currW > 0 && currH > 0 && currW !== currH) {
        let size = Math.min(currW, currH);
        sv('rect', {x:currX*scale, y:currY*scale, width:size*scale, height:size*scale, fill:colors[cIdx%colors.length], stroke:css('--ink'), 'stroke-width':3, rx:4, filter:'url(#f3d)'}, svg);
        sv('text', {x:(currX+size/2)*scale, y:(currY+size/2)*scale+8, 'text-anchor':'middle', 'font-size':22, 'font-weight':'900', fill:css('--ink')}, svg, size);
        if(currW > currH) { currX += size; currW -= size; } 
        else { currY += size; currH -= size; }
        cIdx++;
    }
    if (currW > 0) {
        sv('rect', {x:currX*scale, y:currY*scale, width:currW*scale, height:currH*scale, fill:colors[cIdx%colors.length], stroke:css('--ink'), 'stroke-width':3, rx:4, filter:'url(#f3d)'}, svg);
        sv('text', {x:(currX+currW/2)*scale, y:(currY+currH/2)*scale+8, 'text-anchor':'middle', 'font-size':22, 'font-weight':'900', fill:css('--ink')}, svg, currW);
    }
    return st;
}

function choice(box,stem,opts,right,why,ok,explain){

function chips(box,stem,max,want,hint,ok,explain){
  box.append(el(`<p class="say">${stem}</p>`));
  const sel=new Set();const r=el('<div class="nums"></div>');
  for(let n=1;n<=max;n++){
    const b=el(`<button class="num-chip">${n}</button>`);
    b.onclick=()=>{if(done)return;sel.has(n)?sel.delete(n):sel.add(n);b.classList.toggle('on',sel.has(n))};
    r.append(b);
  }
  const msg=el('<p class="msg" style="display:none;"></p>');const cb=el('<div class="row"><button class="btn primary">檢查答案 🔍</button></div>');let done=false;
  cb.firstChild.onclick=()=>{
    if(done)return;
    msg.style.display = 'block';
    const miss=want.filter(n=>!sel.has(n)),extra=[...sel].filter(n=>!want.includes(n));
    if(!miss.length&&!extra.length){
      done=true;msg.className='msg ok';
      msg.innerHTML=`✅ 對了！${want.join('、')}。` + (explain ? '<br>'+explain() : '');
      ok();
    }
    else{msg.className='msg bad';msg.innerHTML=extra.length?`❌ ${extra.sort((a,b)=>a-b).join('、')} 不對喔。${hint(extra[0])}`:`❌ 還少了 ${miss.length} 個，再找找看。`}
  };
  box.append(r,cb,msg);
}

function numIn(box,stem,want,hint,ok,explain){
  const eq=el(`<div class="eq" style="font-size:24px"><span>${stem}</span><input class="num" id="ni" inputmode="numeric" aria-label="答案"><button class="btn primary">檢查 🔍</button></div>`);

    }
    else{msg.className='msg bad';msg.innerHTML='❌ ' + hint(v)}

}

function fillIn(box,html,wants,ok,extra,explain){
  const eq=el(`<div class="eq" style="background:#f8f9fa;">${html}<button class="btn primary">檢查 🔍</button></div>`),msg=el('<p class="msg" style="display:none;"></p>');let done=false;
  eq.querySelector('button').onclick=()=>{

    }

  box.append(eq,msg);
}


const mults=(n,max)=>{const a=[];for(let k=n;k<=max;k+=n)a.push(k);return a};
const facts=n=>{const a=[];for(let k=1;k<=n;k++)if(n%k===0)a.push(k);return a};

/* 數線：0..N，青蛙跳 */
function numberLine(N,frogs,opts){
  opts=opts||{};const st=svgBox(opts.h||200);const X0=50,W=900,step=W/N;
  sv('line',{x1:X0,y1:120,x2:X0+W,y2:120,stroke:css('--ink'),'stroke-width':4, filter:'url(#f3d-light)'}, st.firstChild);
  const landed=frogs.map(f=>new Set(mults(f.n,f.k*f.n)));
  
  for(let i=0;i<=N;i++){
    const x=X0+i*step;
    const both=landed.length>1&&landed.every(s=>s.has(i));
    const any=landed.some(s=>s.has(i));
    sv('line',{x1:x,y1:110,x2:x,y2:130,stroke:css('--ink'),'stroke-width':2, filter:'url(#f3d-light)'}, st.firstChild);
    if(both)sv('circle',{cx:x,cy:120,r:Math.min(18,step*.48),fill:css('--diff'), filter:'url(#glow)'}, st.firstChild);
    if(N<=40||i%2===0||any){
      sv('text',{x,y:155,'text-anchor':'middle','font-size':N>40?14:18,'font-weight':900,fill:both?css('--ink'):any?css('--accent-shadow'):css('--muted')}, st.firstChild, i);
    }
  }
  
  frogs.forEach((f,fi)=>{
    const col=fi?css('--c2'):css('--c1');
    for(let j=0;j<f.k;j++){
      const x1=X0+j*f.n*step,x2=X0+(j+1)*f.n*step,mid=(x1+x2)/2,hgt=Math.min(80,(x2-x1)*.6)*(fi?-1:1);
      if(fi)sv('path',{d:`M${x1} 120 Q${mid} ${120+Math.abs(hgt)+30} ${x2} 120`,fill:'none',stroke:col,'stroke-width':6, 'stroke-linecap':'round', filter:'url(#f3d)'}, st.firstChild);
      else sv('path',{d:`M${x1} 120 Q${mid} ${120-hgt-30} ${x2} 120`,fill:'none',stroke:col,'stroke-width':6, 'stroke-linecap':'round', filter:'url(#f3d)'}, st.firstChild);
      sv('circle',{cx:x2,cy:120,r:8,fill:col, filter:'url(#f3d)'}, st.firstChild);
    }
  });
  return st;
}

/* 一條布：N 格，每段剪 s 格 */
function cloth(x,y,w,h,N,s,colVar,label){
  const cw=w/N,has=s>0,full=has?Math.floor(N/s)*s:0,col=css(colVar);
  sv('rect',{x,y,width:w,height:h,fill:css('--cloth'),stroke:css('--ink'),'stroke-width':3,rx:8, filter:'url(#f3d)'});
  for(let i=0;i<N;i++){
    const ok=i<full,piece=has?Math.floor(i/s):0;
    if(has)sv('rect',{x:x+i*cw+2,y:y+2,width:cw-4,height:h-4,rx:4, fill:ok?col:css('--diff'), opacity:ok?(piece%2?0.6:1):1});
    if(i>0)sv('line',{x1:x+i*cw,y1:y,x2:x+i*cw,y2:y+h,stroke:css('--ink'),'stroke-width':1,'stroke-dasharray':'4 4'});
  }
  if(has)for(let j=1;j*s<N;j++)sv('line',{x1:x+j*s*cw,y1:y-6,x2:x+j*s*cw,y2:y+h+6,stroke:css('--ink'),'stroke-width':4, 'stroke-linecap':'round', filter:'url(#f3d-light)'});
  if(label)sv('text',{x,y:y-12,'font-size':18, 'font-weight':800, fill:css('--muted')},label);
}

/* ---------- 第 4 階 最小公倍數 ---------- */
const PAIRS4=[[2,3],[4,6],[6,8],[5,7],[4,10],[9,12]];
function lcmHint(a,b){return v=>{const L=lcm(a,b);if(v%a||v%b)return `${v} 還不是 ${a} 和 ${b} 的公倍數。`;if(v>L)return `${v} 是公倍數，但不是最小的，往前找找。`;return '再算算看。'}}
function L4(p){
  p.append(el('<p class="lbl">先做做看 💡</p>'));
  const pr=G.step.pr4||PAIRS4[0],a=pr[0],b=pr[1],L=lcm(a,b),N=Math.min(60,L*2);
  p.append(el(`<p class="say">公倍數有很多個，其中<b>第一次</b>兩隻青蛙踩到同一格的，就是<b>最小公倍數</b> 👑。</p>`));
  
  const r=el('<div class="row"><span class="note">換一組：</span></div>');
  PAIRS4.forEach(q=>{const bt=el(`<button class="btn" aria-pressed="${q[0]===a&&q[1]===b}">${q[0]} 和 ${q[1]}</button>`);bt.onclick=()=>{G.step.pr4=q;render()};r.append(bt)});p.append(r);
  
  const st=numberLine(N,[{n:a,k:Math.floor(N/a)},{n:b,k:Math.floor(N/b)}],{h:220});
  const cx=50+L*900/N;
  sv('circle',{cx,cy:120,r:Math.min(24,900/N*.7),fill:'none',stroke:css('--accent'),'stroke-width':5, filter:'url(#f3d)'}, st.firstChild);
  sv('text',{x:cx,y:80,'text-anchor':'middle','font-size':18,'font-weight':900,fill:css('--accent-shadow')},'✨ 最小公倍數', st.firstChild);
  p.append(st);
  
  const big=Math.max(a,b),small=Math.min(a,b);
  p.append(el(`<div class="eq" style="flex-direction:column;align-items:flex-start;gap:8px">
    <span>${a} 的倍數：${mults(a,L).join('、')}</span>
    <span>${b} 的倍數：${mults(b,L).join('、')}</span>
    <span style="background:#ffebee; padding:4px 12px; border-radius:8px; border:2px solid #ffcdd2;"><b>🏆 ${a} 和 ${b} 的最小公倍數 ＝ <span style="color:var(--accent-shadow); font-size:32px;">${L}</span></b></span>
  </div>`));
  
  p.append(el(`<p class="note" style="padding:10px 16px; background:#f4f7f6; border-radius:12px; border:2px dashed #b0bec5; color:#455a64;">💡 <b>小技巧：</b>從比較大的數 ${big} 的倍數開始（${big}、${big*2}、${big*3}……），一個一個檢查是不是 ${small} 的倍數，第一個找到的就是最小公倍數。</p>`));
  
  practice(p,[
    (b,ok)=>numIn(b,'6 和 9 的最小公倍數是：',18,lcmHint(6,9),ok, ()=>showShortDiv(6,9,'lcm')),
    (b,ok)=>numIn(b,'4 和 10 的最小公倍數是：',20,lcmHint(4,10),ok, ()=>showShortDiv(4,10,'lcm')),
    (b,ok)=>numIn(b,'3 和 5 的最小公倍數是：',15,lcmHint(3,5),ok, ()=>showShortDiv(3,5,'lcm')),
    (b,ok)=>numIn(b,'A 公車每 6 分鐘一班，B 公車每 8 分鐘一班。兩路公車同時發車後，至少要幾分鐘才會再同時發車？',24,lcmHint(6,8),ok, ()=>showShortDiv(6,8,'lcm')),
    (b,ok)=>numIn(b,'12 和 18 的最小公倍數是：',36,lcmHint(12,18),ok, ()=>showShortDiv(12,18,'lcm'))
  ]);
}

/* ---------- 第 5 階 公因數 ---------- */
const PAIRS5=[[12,18],[8,12],[16,24],[15,20]];
function L5(p){
  p.append(el('<p class="lbl">先做做看 💡</p>'));
  const pr=G.step.pr5||PAIRS5[0],a=pr[0],b=pr[1],s=G.step.s||0,found=G.step.found||(G.step.found=[]);
  p.append(el(`<p class="say">有一條 <b style="color:var(--c1-shadow)">${a} 格</b>的藍布和一條 <b style="color:var(--c2-shadow)">${b} 格</b>的紫布。用同一把<b>尺 📏</b>，每次量一樣長，兩條布都要<b>剛好量完不剩</b>。尺可以是多長？</p>`));
  
  const r0=el('<div class="row"><span class="note">換兩條布：</span></div>');
  PAIRS5.forEach(q=>{const bt=el(`<button class="btn" aria-pressed="${q[0]===a&&q[1]===b}">${q[0]} 和 ${q[1]}</button>`);
    bt.onclick=()=>{G.step.pr5=q;G.step.s=0;G.step.found=[];render()};r0.append(bt)});p.append(r0);
    
  const r1=el('<div class="row"><span class="note">尺長：</span></div>');
  for(let v=1;v<=Math.min(a,b);v++){const bt=el(`<button class="btn" aria-pressed="${v===s}">${v} 格</button>`);
    bt.onclick=()=>{G.step.s=v;if(a%v===0&&b%v===0&&!found.includes(v))found.push(v);render()};r1.append(bt)}
  p.append(r1);
  
  const mx=Math.max(a,b),st=svgBox(220,'兩條布');
  cloth(30,40,920*a/mx,56,a,s,'--c1',`藍布 ${a} 格`);
  cloth(30,140,920*b/mx,56,b,s,'--c2',`紫布 ${b} 格`);
  p.append(st);
  
  if(s){
    const ra=a%s,rb=b%s;
    p.append(el(`<p class="msg ${ra||rb?'bad':'ok'}" style="font-size:20px; padding:12px 20px;">📏 尺長 ${s}：藍布${ra?`會剩 ${ra} 格`:'剛好量完'}，紫布${rb?`會剩 ${rb} 格`:'剛好量完'}。<br>${ra||rb?`⚠️ ${s} 不是公因數。`:`✅ <b>${s}</b> 同時是 ${a} 和 ${b} 的因數，叫做<b>公因數</b>！`}</p>`));
  } else {
    p.append(el('<p class="note">👇 選一個尺長試試看。</p>'));
  }
  
  const cf=facts(a).filter(x=>b%x===0),got=[...found].sort((x,y)=>x-y);
  p.append(el(`<div class="eq">已找到的公因數：<b style="color:var(--ok-shadow)">${got.length?got.join('、'):'（還沒有）'}</b></div>`));
  
  if(cf.every(f=>found.includes(f))) {
    p.append(el(`<p class="note" style="font-size:19px; padding:10px 16px; background:#e8f5e9; border:2px solid var(--ok); color:#1b5e20;">全部找到了！🎉 ${a} 和 ${b} 的公因數有 <b style="font-size:22px">${cf.join('、')}</b>。公因數就是「兩個數都能整除」的數。</p>`));
  }
  
  practice(p,[
    (b,ok)=>chips(b,'把 <b>12 和 18 的公因數</b>全部點起來。',18,facts(12).filter(x=>18%x===0),x=>12%x?`${x} 不是 12 的因數。`:`${x} 不是 18 的因數。`,ok),
    (b,ok)=>choice(b,'4 是 8 和 12 的公因數嗎？',['是','不是'],0,['8÷4＝2、12÷4＝3，兩個都整除。','8÷4＝2、12÷4＝3，算算看。'],ok),
    (b,ok)=>choice(b,'6 是 12 和 15 的公因數嗎？',['是','不是'],1,['12÷6＝2，但 15÷6 會剩 3。','15÷6 會剩 3，不能整除。'],ok),
    (b,ok)=>numIn(b,'16 和 24 的公因數共有幾個？',4,v=>`公因數是 1、2、4、8。數數看。（你寫了 ${v}）`,ok, ()=>showShortDiv(16,24,'gcd'))
  ]);
}

/* ---------- 第 6 階 最大公因數 ---------- */
const PAIRS6=[[12,18],[8,12],[16,24],[15,20],[18,30]];
function gcdHint(a,b){return v=>{const g=gcd(a,b);if(v<=0||a%v||b%v)return `${v} 不是 ${a} 和 ${b} 的公因數。`;if(v<g)return `${v} 是公因數，但還有更大的。`;return '再算算看。'}}
function L6(p){
  p.append(el('<p class="lbl">先做做看 💡</p>'));
  const pr=G.step.pr6||PAIRS6[0],a=pr[0],b=pr[1],g=gcd(a,b),fa=facts(a),fb=facts(b),cf=fa.filter(x=>b%x===0);
  p.append(el(`<p class="say">公因數有好幾個，其中<b>最長</b>的那把尺，就是<b>最大公因數</b> 🏆。</p>`));
  
  const r=el('<div class="row"><span class="note">換兩條布：</span></div>');
  PAIRS6.forEach(q=>{const bt=el(`<button class="btn" aria-pressed="${q[0]===a&&q[1]===b}">${q[0]} 和 ${q[1]}</button>`);bt.onclick=()=>{G.step.pr6=q;render()};r.append(bt)});p.append(r);
  
  const mx=Math.max(a,b),st=svgBox(220,'最長的尺');
  cloth(30,40,920*a/mx,56,a,g,'--c1',`藍布 ${a} 格，尺長 ${g}`);
  cloth(30,140,920*b/mx,56,b,g,'--c2',`紫布 ${b} 格，尺長 ${g}`);
  p.append(st);
  
  p.append(el(`<div class="eq" style="flex-direction:column;align-items:flex-start;gap:8px">
    <span>${a} 的因數：${fa.join('、')}</span>
    <span>${b} 的因數：${fb.join('、')}</span>
    <span>公因數：${cf.join('、')}</span>
    <span style="background:#fff8e1; padding:6px 16px; border-radius:12px; border:2px solid #ffecb3;"><b>🏆 ${a} 和 ${b} 的最大公因數 ＝ <span style="color:#f57f17; font-size:32px">${g}</span></b></span>
  </div>`));
  
  p.append(el(`<p class="note" style="padding:10px 16px; background:#f4f7f6; border-radius:12px; border:2px dashed #b0bec5; color:#455a64;">💡 <b>小技巧：</b>從比較小的數 ${Math.min(a,b)} 的因數開始，由大往小檢查，第一個也是另一個數的因數的，就是最大公因數。</p>`));
  
  practice(p,[
    (b,ok)=>numIn(b,'12 和 16 的最大公因數是：',4,gcdHint(12,16),ok, ()=>showShortDiv(12,16,'gcd')),
    (b,ok)=>numIn(b,'18 和 24 的最大公因數是：',6,gcdHint(18,24),ok, ()=>showShortDiv(18,24,'gcd')),
    (b,ok)=>numIn(b,'20 和 30 的最大公因數是：',10,gcdHint(20,30),ok, ()=>showShortDiv(20,30,'gcd')),
    (b,ok)=>numIn(b,'有 24 格的藍布和 36 格的紫布，要剪成一樣長、不能剩的小段，每段最長幾格？',12,gcdHint(24,36),ok, ()=>showShortDiv(24,36,'gcd')),
    (b,ok)=>choice(b,'7 和 9 的最大公因數是多少？',['1','3','7','9'],0,['7 和 9 除了 1 以外沒有共同的因數。','3 不是 7 的因數。','7 不是 9 的因數。','9 不是 7 的因數。'],ok, ()=>showShortDiv(7,9,'gcd')),
    (b,ok)=>numIn(b,'15 和 45 的最大公因數是：',15,gcdHint(15,45),ok, ()=>showShortDiv(15,45,'gcd'))
  ]);
}

/* ---------- 第 7 階 用到分數 ---------- */
const FIN=(i0,i1)=>`<span class="frac"><span>${inp('i'+i0,'分子')}</span><span>${inp('i'+i1,'分母')}</span></span>`;
const FINN=(i,den)=>`<span class="frac"><span>${inp('i'+i,'分子')}</span><span>${den}</span></span>`;
const FR7=[[8,12],[6,9],[12,18],[10,15]];
const PA7=[[[1,4],[1,6]],[[1,2],[1,3]],[[3,4],[5,6]],[[2,3],[3,4]]];
function L7(p){
  p.append(el('<p class="lbl">先做做看：約分 🍰</p>'));
  const f=G.step.f||FR7[0],g=gcd(f[0],f[1]);
  p.append(el(`<p class="say">${fr(f[0],f[1])} 的分子和分母有公因數，<b>最大公因數是 ${g}</b>。<br>💡 <b>當分子和分母互質時，分數就是最簡分數。</b>想一步就約成最簡分數，把分子和分母<b>都除以它們的最大公因數 ${g}</b>，分數的大小不變，就約成<b>最簡分數</b>。</p>`));
  
  const r=el('<div class="row"><span class="note">換一個分數：</span></div>');
  FR7.forEach(q=>{const bt=el(`<button class="btn" aria-pressed="${q[0]===f[0]&&q[1]===f[1]}">${q[0]}/${q[1]}</button>`);bt.onclick=()=>{G.step.f=q;render()};r.append(bt)});p.append(r);
  
  const st=svgBox(160,'約分前後的布條');
  bar(30,20,920,48,f[1],f[0],css('--c1'));
  bar(30,90,920,48,f[1]/g,f[0]/g,css('--c1'));
  p.append(st);
  
  p.append(el(`<div class="eq" style="justify-content:center;">${fr(f[0],f[1])} ＝ ${fr(`${f[0]}÷${g}`,`${f[1]}÷${g}`)} ＝ <span style="color:var(--accent-shadow); font-size:32px;">${fr(f[0]/g,f[1]/g)}</span></div>`));
  
  p.append(el('<p class="lbl">先做做看：通分 🍕</p>'));
  const q=G.step.q||PA7[0],[x,y]=q,L=lcm(x[1],y[1]),nx=x[0]*L/x[1],ny=y[0]*L/y[1];
  p.append(el(`<p class="say">分母不同的分數要一起算，要先把分母變成一樣。新的分母用兩個分母的<b>最小公倍數</b> ${L}，這叫<b>通分</b>。</p>`));
  
  const r2=el('<div class="row"><span class="note">換兩個分數：</span></div>');
  PA7.forEach(z=>{const bt=el(`<button class="btn" aria-pressed="${z===q||(z[0][0]===x[0]&&z[0][1]===x[1]&&z[1][0]===y[0]&&z[1][1]===y[1])}">${z[0][0]}/${z[0][1]} 和 ${z[1][0]}/${z[1][1]}</button>`);bt.onclick=()=>{G.step.q=z;render()};r2.append(bt)});p.append(r2);
  
  const st2=svgBox(260,'通分前後的布條');
  bar(30,14,920,44,x[1],x[0],css('--c1'));
  bar(30,70,920,44,L,nx,css('--c1'),{sub:L/x[1]});
  bar(30,144,920,44,y[1],y[0],css('--c2'));
  bar(30,200,920,44,L,ny,css('--c2'),{sub:L/y[1]});
  p.append(st2);
  
  const sum=nx+ny;
  p.append(el(`<div class="eq" style="font-size:22px; justify-content:center;">${fr(x[0],x[1])} ＝ ${fr(`${x[0]}×${L/x[1]}`,`${x[1]}×${L/x[1]}`)} ＝ ${fr(nx,L)}</div>`));
  p.append(el(`<div class="eq" style="font-size:22px; justify-content:center;">${fr(y[0],y[1])} ＝ ${fr(`${y[0]}×${L/y[1]}`,`${y[1]}×${L/y[1]}`)} ＝ ${fr(ny,L)}</div>`));
  
  const sg=gcd(sum,L);
  p.append(el(`<div class="eq" style="background:#fff8e1; border-color:#ffe082; justify-content:center;">${fr(x[0],x[1])} ＋ ${fr(y[0],y[1])} ＝ ${fr(nx,L)} ＋ ${fr(ny,L)} ＝ ${fr(sum,L)}${sum>L||sg>1?` ＝ <b style="color:var(--accent-shadow)">${mixed(sum,L)}</b>`:''}</div>`));
  
  practice(p,[
    (b,ok)=>choice(b,'把 12/18 約分，分子分母同除以多少，一次就能約成最簡分數？',['2','3','6','9'],2,['除以 2 得到 6/9，還能再約。','除以 3 得到 4/6，還能再約。','12 和 18 的最大公因數是 6，12/18＝2/3。','9 不是 12 的因數。'],ok, ()=>showShortDiv(12,18,'frac')),
    (b,ok)=>fillIn(b,`把 ${fr(18,24)} 約成最簡分數： ＝ ${FIN(0,1)}`,[3,4],ok,v=>(v[0]*24===v[1]*18)?'大小對了，但還能再約，找最大公因數。':'分子分母要同除以同一個數。', ()=>showShortDiv(18,24,'frac')),
    (b,ok)=>choice(b,'把 1/4 和 1/6 通分，分母最好用哪一個？',['10','12','24'],1,['10 不是 4 的倍數。','4 和 6 的最小公倍數是 12。','24 也可以，但不是最小的，數字會比較大。'],ok, ()=>showShortDiv(4,6,'lcm')),
    (b,ok)=>fillIn(b,`${fr(1,4)} ＝ ${FINN(0,12)}　　${fr(1,6)} ＝ ${FINN(1,12)}`,[3,2],ok, null, ()=>showShortDiv(4,6,'lcm')),
    (b,ok)=>fillIn(b,`${fr(3,4)} ＋ ${fr(5,6)} ＝ ${FINN(0,12)} ＋ ${FINN(1,12)}`,[9,10],ok, null, ()=>showShortDiv(4,6,'lcm')),
    (b,ok)=>choice(b,'3/4 和 5/6，哪一個比較大？',['3/4','5/6'],1,['3/4＝9/12，5/6＝10/12，所以 3/4 比較小。','3/4＝9/12，5/6＝10/12，5/6 比較大。'],ok, ()=>showShortDiv(4,6,'lcm'))
  ]);
}


/* ---------- 第 8 階 短除法 ---------- */
function L8(p){
  p.append(el('<p class="lbl">教學：短除法 ➗</p>'));
  p.append(el(`<p class="say">短除法可以<b>同時求出最大公因數和最小公倍數</b>。把兩個數並排寫好，用一個能同時整除它們的質數去除，把商寫在下面。一直除下去，直到最下面一行的兩個數沒有質數能同時整除（互質）為止。</p>`));
  
  const box = el('<div class="box" style="align-items:center;"></div>');
  box.innerHTML += showShortDiv(24, 60, 'both');
  box.innerHTML += `<p class="note" style="margin-top:16px; font-size:18px;">💡 左邊的質數都能同時整除兩個數，所以它們的乘積就是<b>最大公因數</b>：2×2×3＝12。<br>💡 最下面剩下的 2 和 5 沒有除 1 以外的公因數。左邊的質數再乘以最下面一行的數，就是<b>最小公倍數</b>：2×2×3×2×5＝120。</p>`;
  p.append(box);
  
  practice(p,[
    (b,ok)=>numIn(b,'利用短除法，求 36 和 48 的最大公因數：',12,gcdHint(36,48),ok, ()=>showShortDiv(36,48,'gcd')),
    (b,ok)=>numIn(b,'利用短除法，求 14 和 35 的最小公倍數：',70,lcmHint(14,35),ok, ()=>showShortDiv(14,35,'lcm')),
    (b,ok)=>numIn(b,'利用短除法，求 30 和 45 的最大公因數：',15,gcdHint(30,45),ok, ()=>showShortDiv(30,45,'gcd')),
    (b,ok)=>numIn(b,'利用短除法，求 12 和 18 的最小公倍數：',36,lcmHint(12,18),ok, ()=>showShortDiv(12,18,'lcm'))
  ]);
}

/* ---------- 第 9 階 輾轉相除法 ---------- */
function L9(p){
  p.append(el('<p class="lbl">教學：輾轉相除法 🔄</p>'));
  p.append(el(`<p class="say">當數字很大的時候，分解質因數很費時。<b>輾轉相除法</b>（又叫歐幾里得演算法），只用除法就能求出最大公因數。用較大的數除以較小的數，再用除數除以餘數，如此反覆。<b>當餘數為 0 時，最後一個除數就是最大公因數</b>。</p>`));
  
  const st = el('<div class="box"></div>');
  st.innerHTML = `
    <div style="font-size:20px; font-weight:bold; color:var(--ink); line-height:1.8;">
      以求 1071 和 462 的最大公因數為例：<br>
      <span style="color:var(--c1-shadow)">1071</span> = 2 × <span style="color:var(--c2-shadow)">462</span> + <span style="color:var(--bad)">147</span><br>
      <span style="color:var(--c2-shadow)">462</span> = 3 × <span style="color:var(--bad)">147</span> + <span style="color:var(--accent)">21</span><br>
      <span style="color:var(--bad)">147</span> = 7 × <span style="color:var(--accent)">21</span> + <span style="color:var(--ok-shadow)">0</span><br>
      🎉 餘數為 0，所以最大公因數是 <b style="color:var(--accent-shadow); font-size:26px;">21</b>！
    </div>
  `;
  p.append(st);
  
  p.append(el(`<p class="say">📐 <b>用圖來看：裁正方形。</b><br>拿一個長 64、寬 40 的長方形，先裁下最大正方形，剩下再裁，直到裁滿為止。</p>`));
  const boxSvg = el('<div class="box" style="align-items:center;"></div>');
  boxSvg.append(euclideanSvgDOM(64, 40));
  boxSvg.innerHTML += `<p class="note" style="margin-top:16px;">最後一個裁滿的正方形是 8×8，所以 64 和 40 的最大公因數就是 <b>8</b>。</p>`;
  p.append(boxSvg);
  
  practice(p,[
    (b,ok)=>numIn(b,'用輾轉相除法求 64 和 40 的最大公因數：',8,gcdHint(64,40),ok, ()=>showEuclidean(64,40)),
    (b,ok)=>numIn(b,'用輾轉相除法求 148 和 60 的最大公因數：',4,gcdHint(148,60),ok, ()=>showEuclidean(148,60)),
    (b,ok)=>numIn(b,'用輾轉相除法求 1071 和 462 的最大公因數：',21,gcdHint(1071,462),ok, ()=>showEuclidean(1071,462))
  ]);
}

/* ================= 練習單 ================= */
const rnd=(a,b)=>a+(Math.random()*(b-a+1)|0);
function pickPairs(lo,hi,needG,n,ok){
  const seen=new Set(),out=[];let guard=0;
  while(out.length<n&&guard++<500){
    const a=rnd(lo,hi),b=rnd(lo,hi);
    if(a===b)continue;if(needG&&gcd(a,b)<2)continue;if(ok&&!ok(a,b))continue;
    const k=Math.min(a,b)+','+Math.max(a,b);if(seen.has(k))continue;
    seen.add(k);out.push([a,b])
  }
  return out
}
function gen(lv){
  if(lv===0)return shuffle([2,3,4,5,6,7,8,9,11,12]).map(n=>({q:`${n} 的倍數（由小到大寫 5 個）：`,a:mults(n,n*5).join('、')}));
  if(lv===1)return shuffle([12,16,18,20,24,28,30,36,40,42]).map(n=>({q:`${n} 的因數有哪些？`,a:facts(n).join('、')}));
  if(lv===2)return pickPairs(2,9,false,10,(a,b)=>lcm(a,b)<=50).map(([a,b])=>({q:`${a} 和 ${b} 的公倍數（50 以內）：`,a:mults(a,50).filter(x=>x%b===0).join('、')}));
  if(lv===3)return pickPairs(2,12,false,10).map(([a,b])=>({q:`${a} 和 ${b} 的最小公倍數是：`,a:String(lcm(a,b))}));
  if(lv===4)return pickPairs(6,36,true,10).map(([a,b])=>({q:`${a} 和 ${b} 的公因數有哪些？`,a:facts(a).filter(x=>b%x===0).join('、')}));
  if(lv===5)return pickPairs(6,48,true,10).map(([a,b])=>({q:`${a} 和 ${b} 的最大公因數是：`,a:String(gcd(a,b))}));
  
  // Level 7: 分數
  if (lv===6) {
    const out=[];
    pickPairs(6,36,true,5).forEach(([a,b])=>{const g=gcd(a,b);out.push({q:`把 ${a}/${b} 約成最簡分數：`,a:`${a/g}/${b/g}`})});
    pickPairs(2,9,false,5).forEach(([c,d])=>{const a=rnd(1,c-1),b=rnd(1,d-1),L=lcm(c,d);
      out.push({q:`把 ${a}/${c} 和 ${b}/${d} 通分（最小公分母）：`,a:`${a*L/c}/${L} 和 ${b*L/d}/${L}`})});
    return out;
  }
  
  // Level 8: 短除法
  if (lv===7) {
    const out=[];
    pickPairs(12,60,true,5).forEach(([a,b])=>out.push({q:`用短除法求 ${a} 和 ${b} 的最大公因數：`,a:String(gcd(a,b))}));
    pickPairs(4,20,true,5).forEach(([a,b])=>out.push({q:`用短除法求 ${a} 和 ${b} 的最小公倍數：`,a:String(lcm(a,b))}));
    return out;
  }
  
  // Level 9: 輾轉相除法
  return pickPairs(50,500,true,10).map(([a,b])=>({q:`用輾轉相除法求 ${a} 和 ${b} 的最大公因數：`,a:String(gcd(a,b))}));
}
function drawSheet(items,title,showAns){
  const S=2,W=794,H=1123,c=document.createElement('canvas');c.width=W*S;c.height=H*S;
  const x=c.getContext('2d');x.scale(S,S);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
  const F='"Nunito", "M PLUS Rounded 1c", "PingFang TC", "Microsoft JhengHei", sans-serif';
  x.font=`900 32px ${F}`;x.fillText(title+(showAns?'（解答）':''),50,80);
  x.font=`700 18px ${F}`;x.fillText('姓名：__________　日期：__________　得分：_____ / 10',50,120);
  items.forEach((it,i)=>{
    const y=180+i*95;
    x.fillStyle='#2b2b2b';x.font=`700 22px ${F}`;x.fillText(`${i+1}. ${it.q}`,50,y);
    if(showAns){x.fillStyle='#ff3366';x.fillText('答：'+it.a,80,y+38)}
    else{x.strokeStyle='#dbe4ec';x.lineWidth=2;x.beginPath();x.moveTo(80,y+42);x.lineTo(740,y+42);x.stroke()}
  });
  return c
}
function worksheet(p){
  p.append(el('<p class="lbl">練習單 📝</p>'));
  const box=el('<div class="box"></div>'),prev=el('<div class="wsprev" style="display:flex; gap:16px; flex-wrap:wrap; justify-content:center;"></div>'),row=el('<div class="row"></div>');
  const gb=el('<button class="btn primary" style="font-size:20px;">📄 產生這階的練習單 (10題)</button>'),dl=el('<button class="btn" disabled>⬇️ 下載 PDF (題目+解答)</button>');
  const title=`因數倍數練習單　第 ${G.lv+1} 階：${LV[G.lv].t.replace(/<[^>]*>?/gm, '')}`;let sheets=null;
  
  gb.onclick=async()=>{
    try{await document.fonts.ready}catch(e){}
    const items=gen(G.lv),q=drawSheet(items,title,false),a=drawSheet(items,title,true);
    sheets=[q,a];prev.innerHTML='';prev.append(q,a);dl.disabled=false;
  };
  dl.onclick=()=>{
    if(!sheets)return;
    if(!window.jspdf){alert('PDF 工具載入失敗，請確認網路連線後重新整理。');return}
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    pdf.addImage(sheets[0].toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);pdf.addPage();
    pdf.addImage(sheets[1].toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    pdf.save(`因數倍數練習單-進階版-第${G.lv+1}階.pdf`);
  };
  row.append(gb,dl);box.append(row,prev);p.append(box);
}

/* ================= 主畫面 ================= */
const LEVELS=[L1,L2,L3,L4,L5,L6,L7,L8,L9];
function render(){
  map();
  const p=document.getElementById('panel');p.innerHTML='';
  p.append(el(`<h2 class="title">第 ${G.lv+1} 階　${LV[G.lv].t}</h2>`));
  LEVELS[G.lv](p);
  worksheet(p);
}
render();
</script>
